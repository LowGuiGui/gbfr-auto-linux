# CI for gbfr-auto-linux.
#
# Ubuntu only. The core is platform-free, and Linux is the platform it is headed
# for. The job names below are the checks the dev ruleset requires, so renaming
# a job means updating the ruleset in the same change.

name: ci

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

# Read-only by default; nothing here needs to write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the local uv-managed venv. numpy 2.5.2 needs Python 3.12 or newer.
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ruff parses the source and never imports it, so it needs nothing else.
      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: ruff check
        run: ruff check --output-format=github .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        run: pytest -q
