# Project metadata. Nothing is packaged yet, so there is no build backend:
# dependencies stay pinned in requirements*.txt, and ruff keeps its own file.

[project]
name = "gbfr-auto-linux"
version = "0.0.0"
description = "Battle automation for Granblue Fantasy: Relink on Linux (in preparation)"
requires-python = ">=3.12"
# PEP 639. The code is GPL-2.0-or-later; the template images are the game's artwork,
# outside the GPL. COPYRIGHT explains each part.
license = "GPL-2.0-or-later AND LicenseRef-Cygames-Game-Assets"
license-files = ["LICENSES/*.txt"]
